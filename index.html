<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>G 💜 S Valentine</title>
<style>
html, body {
  margin:0; padding:0; height:100%; width:100%;
  font-family:'Segoe UI',sans-serif;
  background:linear-gradient(135deg,#ff9a9e,#fad0c4);
  overflow:hidden; position:relative;
}

/* Card styling */
.card{
  background: rgba(255,255,255,0.95);
  padding:30px;
  border-radius:20px;
  width:90%;
  max-width:450px;
  min-height:450px;
  text-align:center;
  box-shadow:0 8px 25px rgba(0,0,0,0.3);
  z-index:10;
  position:relative;
  margin:50px auto;
}

/* Titles */
h1,h2{color:#e91e63;}

/* Buttons */
button{width:100%;padding:12px;margin:6px 0;border-radius:20px;border:none;font-size:16px;cursor:pointer;}
.option{background:#ffe4ec;}
.yes{background:#9c27b0;color:white;}
.no{background:#ccc;}
.hidden{display:none;}
.message{font-weight:bold;margin-top:12px;font-size:16px;}

/* Cry emoji */
.cry{font-size:60px;}

/* BTS background images */
.bts-background img{
  position:absolute;
  width:80px;
  height:80px;
  opacity:0.5;
  z-index:1;
  pointer-events:none;
  border-radius:10px;
}
</style>
</head>
<body>

<!-- Card -->
<div class="card">
  <h1 id="question"></h1>
  <div id="options"></div>
  <div id="message" class="message"></div>

  <div id="valentine" class="hidden">
    <h2>💜 Will you be my Valentine? 💜</h2>
    <button class="yes" onclick="yesClicked()">YES 💕</button>
    <button class="no" id="noBtn" onclick="noClicked()">NO 🙃</button>
    <div id="noMsg" class="message"></div>
  </div>

  <div id="yesScreen" class="hidden">
    <h1>💜 She said YES 💜</h1>
    <p>You just made my heart dance 🥰</p>
    <img src="https://media.giphy.com/media/l0MYrBf2pck1a5Vig/giphy.gif" alt="V dancing">
  </div>
</div>

<div class="bts-background" id="btsBackground"></div>

<script>
// Quiz logic
const quiz=[
  {q:"What is my favorite food?",options:["Pizza","Biryani","Burger","Dosa"],answer:"Biryani"},
  {q:"Where did I first propose you?",options:["Restaurant","Beach","On foot path","Temple"],answer:"On foot path"},
  {q:"What is my childhood nick name?",options:["Babu","Chinni","Bunny","Kanna"],answer:"Chinni"},
  {q:"What do I like always about you?",options:["Smile","Anger","Cooking","Style"],answer:"Anger"}
];
let i=0,noCount=0;

const wrongMessages=[
"Oops! Not correct 😜","Try again! 🙃","Wrong choice 😏","Are you serious? 😂",
"Wrong answer, but cute 😅","Ha! Nope 😆","Try pressing the right button 💕","Wrong! But I still love you 😍"
];
const noMessages=[
"Wrong option selected 😏","NO is disabled forever 😂","Universe says YES only 🌌","Nice try 😌","Finger slipped? 😜",
"NO ran away 🏃","System error ❌","Try again 😍","Nope nope nope 🙅"
];

function loadQ(){
  document.getElementById("question").innerText=quiz[i].q;
  const o=document.getElementById("options");
  o.innerHTML="";
  quiz[i].options.forEach(opt=>{
    let b=document.createElement("button");
    b.className="option";
    b.innerText=opt;
    b.onclick=()=>answer(opt);
    o.appendChild(b);
  });
  document.getElementById("message").innerHTML="";
}

function answer(sel){
  const msg=document.getElementById("message");
  if(sel===quiz[i].answer){
    i++;
    if(i<quiz.length){setTimeout(loadQ,500);}
    else{setTimeout(showValentine,500);}
  } else {
    const idx=Math.floor(Math.random()*wrongMessages.length);
    msg.innerHTML='<div class="cry">😭</div><br>'+wrongMessages[idx];
    setTimeout(()=>{msg.innerHTML="";},1000);
  }
}

function showValentine(){
  document.getElementById("question").classList.add("hidden");
  document.getElementById("options").classList.add("hidden");
  document.getElementById("message").classList.add("hidden");
  document.getElementById("valentine").classList.remove("hidden");
}

function noClicked(){
  const r=Math.random(), btn=document.getElementById("noBtn");
  document.getElementById("noMsg").innerText="";
  if(r<0.33){btn.style.transform=`translate(${Math.random()*150}px,${Math.random()*150}px)`;}
  else if(r<0.66){btn.style.visibility="hidden"; setTimeout(()=>btn.style.visibility="visible",1500);}
  else{document.getElementById("noMsg").innerText=noMessages[noCount%noMessages.length]; noCount++;}
}

function yesClicked(){
  document.getElementById("valentine").classList.add("hidden");
  document.getElementById("yesScreen").classList.remove("hidden");
}

// BTS images behind card
const btsUrls=[
"https://media.giphy.com/media/3o7abld2L7m9h3p1du/giphy.gif",
"https://media.giphy.com/media/l0HlQ7LRalJf4hUBq/giphy.gif",
"https://media.giphy.com/media/xUOwGmZ3HV7P8Kkm2A/giphy.gif",
"https://media.giphy.com/media/xUOwGmZ1XhLkTtwqTq/giphy.gif",
"https://media.giphy.com/media/xUOwGmZ1YnwZ0pBrb6/giphy.gif",
"https://media.giphy.com/media/xUOwGmZ1Y8Ho3c4a3y/giphy.gif",
"https://media.giphy.com/media/xUOwGmZ1Y4v1yJb4K8/giphy.gif",
"https://media.giphy.com/media/1oF2jF4xT7xFyQeP6v/giphy.gif",
"https://media.giphy.com/media/l3vR6jvUiyYpC6nQY/giphy.gif",
"https://media.giphy.com/media/l0ExncehJzexFpRHq/giphy.gif"
];

const container=document.getElementById("btsBackground");
btsUrls.forEach(url=>{
  let img=document.createElement("img");
  img.src=url;
  img.style.top=Math.random()*80+"%";
  img.style.left=Math.random()*80+"%";
  container.appendChild(img);
});

// Load first question
loadQ();
</script>
</body>
</html>
