<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>G 💜 S Valentine</title>
<style>
html, body {
  margin:0; padding:0; height:100%; width:100%;
  font-family:'Segoe UI',sans-serif;
  background:linear-gradient(135deg,#ff9a9e,#fad0c4);
  overflow:hidden; position:relative;
}

/* Card styling */
.card{
  background: rgba(255,255,255,0.9);
  backdrop-filter: blur(10px);
  padding:30px;
  border-radius:20px;
  width:90%;
  max-width:450px;
  min-height:450px;
  text-align:center;
  box-shadow:0 8px 25px rgba(0,0,0,0.3);
  z-index:10;
  position:relative;
  margin:50px auto;
}

/* Titles */
h1,h2{color:#e91e63;}

/* Buttons */
button{width:100%;padding:12px;margin:6px 0;border-radius:20px;border:none;font-size:16px;cursor:pointer;}
.option{background:#ffe4ec;}
.yes{background:#9c27b0;color:white;}
.no{background:#ccc;position:relative;}
.hidden{display:none;}
.message{font-weight:bold;margin-top:12px;font-size:16px;}

/* Fireworks */
.firework{position:absolute;font-size:40px;animation:boom 1s ease-out forwards;}
@keyframes boom{0%{transform:scale(0);opacity:1;}100%{transform:scale(3);opacity:0;}}

/* Cry emoji */
.cry{font-size:60px;animation:shake 0.8s;}
@keyframes shake{0%{transform:rotate(0);}25%{transform:rotate(-10deg);}50%{transform:rotate(10deg);}100%{transform:rotate(0);}}

/* G & S heart */
.gs-heart{
  position:fixed;top:50%;left:50%;
  transform:translate(-50%,-50%) scale(0);
  font-size:80px;color:#e91e63;
  animation:popHeart 1s ease-out forwards;
  z-index:11;text-align:center;
}
.gs-heart span{
  position:absolute;top:35%;left:50%;
  transform:translateX(-50%);
  font-size:30px;color:white;font-weight:bold;
}

/* YES screen image */
#yesScreen img{width:200px;}

/* BTS images container behind card */
.bts-background img{
  position:absolute;
  width:80px;
  height:80px;
  opacity:0.6;
  z-index:1;
  border-radius:10px;
}
</style>
</head>
<body>

<!-- Card -->
<div class="card">
  <h1 id="question"></h1>
  <div id="options"></div>
  <div id="message" class="message"></div>

  <div id="valentine" class="hidden">
    <h2>💜 Will you be my Valentine? 💜</h2>
    <button class="yes" onclick="yesClicked()">YES 💕</button>
    <button class="no" id="noBtn" onclick="noClicked()">NO 🙃</button>
    <div id="noMsg" class="message"></div>
  </
