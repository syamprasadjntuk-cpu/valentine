<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>G 💜 S Valentine</title>
<style>
html, body {
  margin:0; padding:0; height:100%; width:100%;
  font-family:'Segoe UI',sans-serif;
  background:linear-gradient(135deg,#ff9a9e,#fad0c4);
  overflow:hidden; position:relative;
}

/* Card styling */
.card{
  background: rgba(255,255,255,0.95);
  padding:30px;
  border-radius:20px;
  width:90%;
  max-width:450px;
  min-height:450px;
  text-align:center;
  box-shadow:0 8px 25px rgba(0,0,0,0.3);
  z-index:20;
  position:relative;
  margin:50px auto;
}

/* Titles */
h1,h2{color:#e91e63;}

/* Buttons */
button{width:100%;padding:12px;margin:6px 0;border-radius:20px;border:none;font-size:16px;cursor:pointer;}
.option{background:#ffe4ec;}
.yes{background:#9c27b0;color:white;}
.no{background:#ccc;position:relative;}
.hidden{display:none;}
.message{font-weight:bold;margin-top:12px;font-size:16px;}

/* Fireworks */
.firework{position:absolute;font-size:40px;animation:boom 1s ease-out forwards;}
@keyframes boom{0%{transform:scale(0);opacity:1;}100%{transform:scale(3);opacity:0;}}

/* Cry emoji */
.cry{font-size:60px;animation:shake 0.8s;}
@keyframes shake{0%{transform:rotate(0);}25%{transform:rotate(-10deg);}50%{transform:rotate(10deg);}100%{transform:rotate(0);}}

/* Floating purple hearts */
.heart{position:fixed;bottom:0;font-size:50px;color:purple;animation:float 4s linear forwards; pointer-events:none;}
.big-heart{font-size:80px !important;}
@keyframes float{to{transform:translateY(-100vh);opacity:0;}}

/* Red G&S heart below card */
.gs-heart{
  position:absolute; top:100%; left:50%;
  transform:translate(-50%,10%);
  width:150px; height:150px;
  background:red;
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:30;
  font-size:40px; color:white; font-weight:bold;
}

/* YES screen image */
#yesScreen img{
  width:250px;
  margin-top:20px;
  z-index:30;
  border-radius:20px;
}

/* Background images */
.bg img{
  position:absolute;
  width:80px;
  height:80px;
  opacity:0.5;
  pointer-events:none;
  border-radius:10px;
  animation:floatBg linear infinite;
}
@keyframes floatBg{
  0%{transform:translateY(0px);}
  50%{transform:translateY(-30px);}
  100%{transform:translateY(0px);}
}
</style>
</head>
<body>

<!-- Background love images -->
<div class="bg" id="bg"></div>

<!-- Card -->
<div class="card">
  <h1 id="question"></h1>
  <div id="options"></div>
  <div id="message" class="message"></div>

  <div id="valentine" class="hidden">
    <h2>💜 Will you be my Valentine? 💜</h2>
    <button class="yes" onclick="yesClicked()">YES 💕</button>
    <button class="no" id="noBtn" onclick="noClicked()">NO 🙃</button>
    <div id="noMsg" class="message"></div>
  </div>

  <div id="yesScreen" class="hidden">
    <h1>💜 She said YES 💜</h1>
    <p>You just made my heart dance 🥰</p>
    <!-- Base64 Love image -->
    <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAANQAAADUCAIAAACo+RnAAAAABGdBTUEAALGPC/xhBQAAACBjSFJNAAB6JgAAgIQAAPoAAACA6AAAdTAAAOpgAAA6mAAAF3CculE8AAAA/0lEQVR42u3RAQ0AAAgDoJvc2hF4QAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA8J/kVAAEoWqNQAAAAASUVORK5CYII=" alt="Love image">
  </div>
  <div id="gsHeart" class="gs-heart">G & S</div>
</div>

<script>
// Quiz
const quiz=[
  {q:"What is my favorite food?",options:["Pizza","Biryani","Burger","Dosa"],answer:"Biryani"},
  {q:"Where did I first propose you?",options:["Restaurant","Beach","On foot path","Temple"],answer:"On foot path"},
  {q:"What is my childhood nick name?",options:["Babu","Chinni","Bunny","Kanna"],answer:"Chinni"},
  {q:"What do I like always about you?",options:["Smile","Anger","Cooking","Style"],answer:"Anger"}
];
let i=0,noCount=0;
const wrongMessages=[
"Oops! Not correct 😜","Try again! 🙃","Wrong choice 😏","Are you serious? 😂",
"Wrong answer, but cute 😅","Ha! Nope 😆","Try pressing the right button 💕","Wrong! But I still love you 😍"
];
const noMessages=[
"Wrong option selected 😏","NO is disabled forever 😂","Universe says YES only 🌌","Nice try 😌","Finger slipped? 😜",
"NO ran away 🏃","System error ❌","Try again 😍","Nope nope nope 🙅"
];

function loadQ(){
  document.getElementById("question").innerText=quiz[i].q;
  const o=document.getElementById("options");
  o.innerHTML="";
  quiz[i].options.forEach(opt=>{
    let b=document.createElement("button");
    b.className="option";
    b.innerText=opt;
    b.onclick=()=>answer(opt);
    o.appendChild(b);
  });
  document.getElementById("message").innerHTML="";
}

function answer(sel){
  const msg=document.getElementById("message");
  if(sel===quiz[i].answer){
    fireworks();
    i++;
    if(i<quiz.length){setTimeout(loadQ,1000);}
    else{setTimeout(showValentine,1000);}
  } else {
    const idx=Math.floor(Math.random()*wrongMessages.length);
    msg.innerHTML='<div class="cry">😭</div><br>'+wrongMessages[idx];
    setTimeout(()=>{msg.innerHTML="";},1000);
  }
}

function fireworks(){
  for(let j=0;j<6;j++){
    let f=document.createElement("div");
    f.className="firework"; f.innerText="🎆";
    f.style.left=Math.random()*100+"%";
    f.style.top=Math.random()*100+"%";
    document.body.appendChild(f);
    setTimeout(()=>f.remove(),1000);
  }
}

function noClicked(){
  const r=Math.random(), btn=document.getElementById("noBtn");
  document.getElementById("noMsg").innerText="";
  if(r<0.33){btn.style.transform=`translate(${Math.random()*150}px,${Math.random()*150}px)`;}
  else if(r<0.66){btn.style.visibility="hidden"; setTimeout(()=>btn.style.visibility="visible",1500);}
  else{document.getElementById("noMsg").innerText=noMessages[noCount%noMessages.length]; noCount++;}
}

function showValentine(){
  document.getElementById("question").classList.add("hidden");
  document.getElementById("options").classList.add("hidden");
  document.getElementById("message").classList.add("hidden");
  document.getElementById("valentine").classList.remove("hidden");
}

function yesClicked(){
  document.getElementById("valentine").classList.add("hidden");
  document.getElementById("yesScreen").classList.remove("hidden");

  // Purple hearts bigger and continuous
  setInterval(()=>{
    let h=document.createElement("div");
    h.className="heart big-heart"; h.innerText="💜";
    h.style.left=Math.random()*100+"%";
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),4000);
  },300);
}

// Start quiz
loadQ();

// Base64 love images for background
const loveUrls=[
  "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAYAAACqaXHeAAABjklEQVR4Xu3XQQqCQBQF0M3//2d7sQ0nUKU5+2lNCcZQ3+FMuGgwNFAI+f0i6fn5gEBERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERER
